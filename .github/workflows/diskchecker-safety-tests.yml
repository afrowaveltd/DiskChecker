name: DiskChecker safety tests

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - "fix/vhdx-layout-and-restore-safety-20261015"

jobs:
  dotnet-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install VHDX validator and headless rendering dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y qemu-utils libfontconfig1 fonts-dejavu-core
      - name: Restore
        run: dotnet restore tests/DiskChecker.Tests/DiskChecker.Tests.csproj
      - name: Compile
        run: dotnet build tests/DiskChecker.Tests/DiskChecker.Tests.csproj --no-restore -c Release
      - name: Run tests
        run: dotnet test tests/DiskChecker.Tests/DiskChecker.Tests.csproj -c Release --no-build
