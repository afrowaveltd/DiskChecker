name: DiskChecker safety tests

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  dotnet-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install independent VHDX validator and headless rendering dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y qemu-utils libfontconfig1 fonts-dejavu-core
      - name: Run desktop/core safety tests
        run: dotnet test tests/DiskChecker.Tests/DiskChecker.Tests.csproj -c Release
      - name: Run TUI safety tests
        run: dotnet test tests/DiskChecker.Tui.Tests/DiskChecker.Tui.Tests.csproj -c Release
