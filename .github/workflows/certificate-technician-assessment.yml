name: Certificate technician assessment

on:
  pull_request:
  push:
    branches:
      - feat/certificate-technician-assessment-20261016

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/DiskChecker.Tests/DiskChecker.Tests.csproj
      - name: Build
        run: dotnet build tests/DiskChecker.Tests/DiskChecker.Tests.csproj -c Release --no-restore
      - name: Tests
        env:
          DISKCHECKER_PDF_QA_DIR: ${{ github.workspace }}/artifacts/certificates
        run: dotnet test tests/DiskChecker.Tests/DiskChecker.Tests.csproj -c Release --no-build
      - name: Upload synthetic PDF layout sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certificate-pdf-layout-${{ matrix.os }}
          path: artifacts/certificates/*.pdf
          if-no-files-found: ignore
