name: Certificate technician assessment

on:
  pull_request:
  push:
    branches:
      - feat/certificate-technician-assessment-20261016

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/DiskChecker.Tests/DiskChecker.Tests.csproj
      - name: Build
        run: dotnet build tests/DiskChecker.Tests/DiskChecker.Tests.csproj -c Release --no-restore
      - name: Tests
        run: dotnet test tests/DiskChecker.Tests/DiskChecker.Tests.csproj -c Release --no-build
